<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Boofi Papelería Kawaii - Catálogo digital">
  <title>Boofi | Papelería Kawaii</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"> <!-- tu hoja de estilos -->
</head>
<body>
  <header>
    <h1>Boofi Papelería Kawaii</h1>
    <input id="search" type="text" placeholder="Buscar productos...">
    <div id="categories"></div>
  </header>

  <main>
    <p id="productCount"></p>
    <div id="empty" class="hidden">No hay productos disponibles 😢</div>
    <section id="products" class="grid"></section>
  </main>

  <aside id="cart">
    <button id="closeCart">Cerrar ✖</button>
    <h2>Carrito</h2>
    <div id="cartItems"></div>
    <p>Total: <span id="cartTotal">$0</span></p>
    <button id="clearCart">Vaciar carrito</button>
    <button id="whatsapp">Enviar pedido por WhatsApp</button>
  </aside>

  <button id="openCart">🛒 <span id="cartCount">0</span></button>
  <div id="overlay"></div>

  <!-- 🚀 Aquí se conecta tu script -->
  <script src="script.js"></script>
</body>
</html>
